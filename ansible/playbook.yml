---
- name: Configure EC2 Instance and Install Docker
  hosts: webservers
  become: yes

  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Install required prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: latest
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add remote user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Verify Docker is functional by running hello-world
      ansible.builtin.command: docker run --rm hello-world
      register: docker_test_result
      changed_when: false

    - name: Print Docker verification output
      ansible.builtin.debug:
        msg: "{{ docker_test_result.stdout_lines }}"

